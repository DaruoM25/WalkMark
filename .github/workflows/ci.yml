name: WalkMark CI

on:
  push:
    branches:
      - "agents/**"
      - "fix/**"
      - "infra/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: walkmark-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-ci:
    name: android-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: 1. Compile Android Debug
        run: |
          set +e
          ./gradlew :composeApp:compileDebugKotlinAndroid --no-daemon --stacktrace > compile_log.txt 2>&1
          EXIT_CODE=$?
          python3 -c "
          with open('compile_log.txt') as f:
              for line in f:
                  if 'e: ' in line or 'ERROR' in line or 'Unresolved' in line:
                      print(f'::error::{line.strip()}')
          "
          cat compile_log.txt
          exit $EXIT_CODE

      - name: 2. Run Android Unit Tests
        run: |
          set +e
          ./gradlew :composeApp:testDebugUnitTest --no-daemon --stacktrace > test_log.txt 2>&1
          EXIT_CODE=$?
          python3 -c "
          with open('test_log.txt') as f:
              for line in f:
                  if 'FAILED' in line or 'FAILURE' in line or 'ERROR' in line or 'e: ' in line:
                      print(f'::error::{line.strip()}')
          "
          cat test_log.txt
          exit $EXIT_CODE

      - name: 3. Assemble Android Debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace

      - name: 4. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: walkmark-debug-apk
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk
          retention-days: 7
