name: WalkMark CI

on:
  push:
    branches:
      - "agents/**"
      - "fix/**"
      - "infra/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: walkmark-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-ci:
    name: android-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: 1. Compile Android Debug
        run: ./gradlew :composeApp:compileDebugKotlinAndroid --no-daemon --stacktrace

      - name: 2. Run Android Unit Tests
        run: ./gradlew :composeApp:testDebugUnitTest --no-daemon --stacktrace

      - name: 3. Assemble Android Debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace

      - name: 4. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: walkmark-debug-apk
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk
          retention-days: 7
