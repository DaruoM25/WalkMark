name: WalkMark CI

on:
  push:
    branches:
      - "agents/**"
      - "fix/**"
      - "infra/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: walkmark-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-ci:
    name: android-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      REVENUECAT_PUBLIC_KEY: ${{ secrets.REVENUECAT_PUBLIC_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: 1. Compile Android Debug
        id: compile
        run: |
          set -o pipefail
          ./gradlew :composeApp:compileDebugKotlinAndroid --no-daemon --stacktrace 2>&1 | tee compile_log.txt

      - name: Emit Compile Diagnostics
        if: failure()
        run: |
          python3 -c "
          import sys
          try:
              with open('compile_log.txt') as f:
                  lines = f.readlines()
              errs = [l.strip() for l in lines if 'e: ' in l or 'error:' in l.lower() or 'unresolved' in l.lower() or 'none of the following' in l.lower() or 'cannot find' in l.lower()]
              if not errs:
                  errs = [l.strip() for l in lines[-40:]]
              for e in errs[:25]:
                  msg = e.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error::' + msg)
          except Exception as ex:
              print('::error::Logger failed: ' + str(ex))
          "

      - name: 2. Run Android Unit Tests
        run: |
          set -o pipefail
          ./gradlew :composeApp:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee test_log.txt

      - name: Emit Test Diagnostics
        if: failure()
        run: |
          python3 -c "
          try:
              with open('test_log.txt') as f:
                  lines = f.readlines()
              errs = [l.strip() for l in lines if 'FAILED' in l or 'FAILURE' in l or 'e: ' in l or 'Exception' in l or 'Assertion' in l or 'at com.walkmark' in l]
              if not errs:
                  errs = [l.strip() for l in lines[-40:]]
              for e in errs[:35]:
                  msg = e.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error::' + msg)
          except Exception as ex:
              print('::error::Logger failed: ' + str(ex))
          "

      - name: 3. Assemble Android Debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace

      - name: 4. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: walkmark-debug-apk
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk
          retention-days: 7
