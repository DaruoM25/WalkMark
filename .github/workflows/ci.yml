name: WalkMark Foundation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android-and-common-tests:
    name: Android Build & Unit Tests (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run KMP and Android Unit Tests
        run: ./gradlew :composeApp:testDebugUnitTest

      - name: Assemble Android Debug APK
        run: ./gradlew :composeApp:assembleDebug

  ios-build:
    name: iOS Build & Framework Verification (macOS)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build iOS Simulator Framework
        run: ./gradlew :composeApp:linkDebugTestIosSimulatorArm64
