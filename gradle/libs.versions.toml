[versions]
agp = 8.7.0
kotlin = 2.0.21
compose-multiplatform = 1.7.0
androidx-activityCompose = 1.9.3
androidx-lifecycle = 2.8.3
androidx-test-junit = 1.2.1
espresso-core = 3.6.1
kotlinx-coroutines = 1.9.0
ksp = 2.0.21-1.0.27
room = 2.7.0-alpha11
sqlite = 2.5.0-SNAPSHOT
androidx-sqlite = 2.5.0-alpha11
turbine = 1.1.0

[libraries]
kotlin-test = { module = org.jetbrains.kotlin:kotlin-test, version.ref = kotlin }
kotlin-test-junit = { module = org.jetbrains.kotlin:kotlin-test-junit, version.ref = kotlin }
androidx-activity-compose = { module = androidx.activity:activity-compose, version.ref = androidx-activityCompose }
androidx-lifecycle-viewmodel = { group = org.jetbrains.androidx.lifecycle, name = lifecycle-viewmodel, version.ref = androidx-lifecycle }
androidx-lifecycle-runtime-compose = { group = org.jetbrains.androidx.lifecycle, name = lifecycle-runtime-compose, version.ref = androidx-lifecycle }
kotlinx-coroutines-core = { module = org.jetbrains.kotlinx:kotlinx-coroutines-core, version.ref = kotlinx-coroutines }
kotlinx-coroutines-test = { module = org.jetbrains.kotlinx:kotlinx-coroutines-test, version.ref = kotlinx-coroutines }
turbine = { module = app.cash.turbine:turbine, version.ref = turbine }

# Room KMP
androidx-room-runtime = { module = androidx.room:room-runtime, version.ref = room }
androidx-room-compiler = { module = androidx.room:room-compiler, version.ref = room }
androidx-sqlite-bundled = { module = androidx.sqlite:sqlite-bundled, version.ref = androidx-sqlite }

[plugins]
androidApplication = { id = com.android.application, version.ref = agp }
androidLibrary = { id = com.android.library, version.ref = agp }
jetbrainsCompose = { id = org.jetbrains.compose, version.ref = compose-multiplatform }
compose-compiler = { id = org.jetbrains.kotlin.plugin.compose, version.ref = kotlin }
kotlinMultiplatform = { id = org.jetbrains.kotlin.multiplatform, version.ref = kotlin }
ksp = { id = com.google.devtools.ksp, version.ref = ksp }
androidxRoom = { id = androidx.room, version.ref = room }
